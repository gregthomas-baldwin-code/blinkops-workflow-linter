name: build-vsix
on: [push, workflow_dispatch]
jobs:
  binary:
    strategy:
      matrix:
        include:
          - { os: macos-14, name: darwin-arm64 }
          - { os: macos-13, name: darwin-x64 }
          - { os: windows-latest, name: win32-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install pyyaml jsonschema pyinstaller
      - run: python scripts/build_binary.py
      - uses: actions/upload-artifact@v4
        with: { name: bin-${{ matrix.name }}, path: extension/bin }
  package:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: extension/bin, pattern: bin-*, merge-multiple: true }
      - run: chmod +x extension/bin/*/blinklint || true
      - run: python3 scripts/build_vsix.py
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: dist/*.vsix }
